# cargo-deny configuration.
#
# Runs in CI on every PR + nightly at 04:00 UTC. The crate's
# dependency surface is small and entirely on crates.io, so this
# template is intentionally strict: no unknown registries, no
# git deps, no duplicate versions, no wildcard requirements.
#
# When a violation surfaces, prefer the upstream fix:
#   - multiple-versions  -> bump the dep pulling in the older
#                           one, or add a [patch.crates-io] until
#                           upstream catches up; only [bans.skip]
#                           with a rationale if upstream-blocked.
#   - advisory           -> upgrade the affected crate; only add
#                           to [advisories.ignore] with the
#                           RUSTSEC id and a written-out reason.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste 1.0.x is unmaintained but still depended on by ark-ff's
    # proc-macro layer (ark-ff-macros). No safe upgrade exists in
    # the 0.5.x ark-* line we're pinned against, and ark-* hasn't
    # cut a release that drops paste. Mirrors the same ignore in
    # pso-poseidon and pso-zk-circuits. Revisit when ark-* moves
    # off paste.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    # `Unicode-3.0` is the current license of `unicode-ident` (pulled
    # in transitively via every proc-macro crate). `Unicode-DFS-2016`
    # is the predecessor; we keep both to span old + new releases of
    # any transitive ark-* / proc-macro crate.
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
deny = []
skip = [
    # syn 2 and syn 3 coexist, and the split is INSIDE arkworks — we
    # pull neither directly and cannot resolve it from here:
    #
    #   syn 2 <- ark-ff-asm / ark-ff-macros / ark-serialize-derive
    #   syn 3 <- educe -> enum-ordinalize-derive (an ark-ec/ff/poly dep)
    #
    # So one arkworks release requires both majors of syn at once.
    # Checked against the ladder above before skipping: bumping does
    # not help (0.6.0 resolves to the same pair — ark-ff-asm 0.6.0 is
    # still on syn 2), and a [patch.crates-io] would mean carrying a
    # fork of arkworks' proc-macro layer to satisfy a lint. Both syn
    # versions are build-time proc-macro dependencies: nothing of
    # either lands in the compiled artifact.
    #
    # This surfaced as a NIGHTLY failure on an unchanged commit —
    # Cargo.lock is deliberately not committed for a library, so the
    # scheduled run re-resolves and picks up ecosystem drift. syn 3.0
    # shipping is what moved thiserror-impl and enum-ordinalize-derive
    # across while arkworks' own macro crates stayed on 2.
    #
    # Revisit when arkworks moves its proc-macro layer to syn 3 — the
    # same release that should let the RUSTSEC-2024-0436 paste ignore
    # above go too.
    { crate = "syn", reason = "arkworks requires syn 2 and syn 3 simultaneously; build-time only, no upstream fix available" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
